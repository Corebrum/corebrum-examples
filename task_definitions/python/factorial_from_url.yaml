task_definition:
  name: "factorial_from_url"
  version: "1.0"
  description: "Compute factorial using embedded inputs; publishes via Zenoh"
  inputs:
    - name: "number"
      type: "number"
  outputs:
    - name: "result"
      type: "zenoh"
      key: "cortex/examples/factorial/result"
  compute_logic:
    type: "expression"
    language: "python"
    timeout_seconds: 30
    code: |
      import json, time
      n = int(inputs.get("number", 10))
      def factorial(x):
          return 1 if x <= 1 else x * factorial(x - 1)
      start = time.time()
      f = factorial(n)
      end = time.time()
      result = {"factorial": f, "input_number": n, "computation_time_ms": int((end - start) * 1000)}
      print(json.dumps(result))
  validation: []
  metadata: {}
